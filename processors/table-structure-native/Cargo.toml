[package]
name = "table-structure-processor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "table-structure-processor"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
base64 = "0.22"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
