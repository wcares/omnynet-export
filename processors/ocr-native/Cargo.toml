[package]
name = "ocr-processor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ocr-processor"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }
ndarray = "0.16"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
